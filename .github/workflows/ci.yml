# =============================================================================
# AOP continuous integration.
#
# One job per component, matching the repo layout and the exact test commands
# documented in each component's README / package.json:
#   - edge        : Cloudflare Worker — plain Node, no deps, no network
#   - ingestion   : Node.js/Express service — pure-module test suite
#   - optimizer   : Python stdlib engine — unittest + CLI smoke
#   - db          : migrations applied against a real PostgreSQL 16 service
#
# All jobs run on every push and pull request targeting main. They are the
# merge gate for the PR.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a rapid push sequence doesn't
# queue redundant CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  edge:
    name: edge — Cloudflare Worker proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install: the worker has zero runtime deps and the suite runs on
      # plain Node (env/ctx stubbed, globalThis.fetch monkeypatched).
      - name: Syntax check
        working-directory: edge
        run: find src -name '*.js' -exec node --check {} +
      - name: Test
        working-directory: edge
        run: npm test

  # ---------------------------------------------------------------------------
  ingestion:
    name: ingestion — attribution service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ingestion/package-lock.json
      - name: Install
        working-directory: services/ingestion
        run: npm ci
      # Syntax-check EVERY source file (routes/app/index are not imported by the
      # pure test suite, so this is what catches syntax errors in them).
      - name: Syntax check
        working-directory: services/ingestion
        run: find src -name '*.js' -exec node --check {} +
      - name: Test
        working-directory: services/ingestion
        run: npm test

  # ---------------------------------------------------------------------------
  optimizer:
    name: optimizer — policy scoring engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Stdlib only — nothing to install.
      - name: Test
        working-directory: optimizer
        run: python -m unittest discover -v
      - name: CLI smoke (rewriter artifact + what-if simulator)
        working-directory: optimizer
        run: |
          POLICY="We charge a 15% restocking fee. Returns within 14 days for store credit only. Ships in 4-6 business days."
          echo "$POLICY" | python -m aop_optimizer --pretty --jsonld
          echo "$POLICY" | python -m aop_optimizer --pretty --simulate

  # ---------------------------------------------------------------------------
  dashboard:
    name: dashboard — Loss Diagnosis SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        working-directory: dashboard
        run: npm ci
      - name: Test (pure formatting helpers)
        working-directory: dashboard
        run: npm test
      - name: Build
        working-directory: dashboard
        run: npm run build

  # ---------------------------------------------------------------------------
  demo:
    name: demo — harness scripts + scenario generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zero-dependency stdlib scripts: syntax + the pure scenario suite.
      - name: Syntax check
        run: |
          node --check demo/mock-storefront.mjs
          node --check demo/agent-simulator.mjs
          node --check demo/lib/scenarios.js
          bash -n demo/run-demo.sh
      - name: Test
        run: node --test demo/test/scenarios.test.mjs

  # ---------------------------------------------------------------------------
  db:
    name: db — migrations (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aop
          POSTGRES_PASSWORD: aop
          POSTGRES_DB: aop
        ports:
          - 5432:5432
        # Wait until the server accepts connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U aop -d aop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aop:aop@localhost:5432/aop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: db/package-lock.json
      - name: Runner syntax check
        working-directory: db
        run: node --check migrate.mjs
      - name: Install
        working-directory: db
        run: npm ci
      - name: Apply migrations
        working-directory: db
        run: npm run migrate
      - name: Idempotency — second run must no-op
        working-directory: db
        run: npm run migrate
      - name: Verify generated commission column
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO merchant_profiles (shopify_shop_domain, access_token_encrypted)
            VALUES ('ci.example.com', 'enc:ci');
          INSERT INTO reconciled_agent_orders
            (merchant_id, shopify_order_id, transaction_token, gross_merchandise_value)
            SELECT id, 'ci-order-1', 'tok_ci', 1234.56 FROM merchant_profiles
             WHERE shopify_shop_domain = 'ci.example.com';
          -- 1234.56 * 0.005 = 6.1728 -> round(,2) = 6.17 (billing math is the
          -- schema's generated column, not app code).
          DO $$
          DECLARE fee numeric;
          BEGIN
            SELECT commission_fee INTO fee FROM reconciled_agent_orders
             WHERE shopify_order_id = 'ci-order-1';
            IF fee IS DISTINCT FROM 6.17 THEN
              RAISE EXCEPTION 'commission_fee % != expected 6.17', fee;
            END IF;
            RAISE NOTICE 'generated commission_fee = % (ok)', fee;
          END $$;
          -- commission_rate > 1 must be rejected by the CHECK bound.
          DO $$
          BEGIN
            INSERT INTO reconciled_agent_orders
              (merchant_id, shopify_order_id, transaction_token,
               gross_merchandise_value, commission_rate)
              SELECT id, 'ci-order-bad', 'tok_ci', 100, 5.0 FROM merchant_profiles
               WHERE shopify_shop_domain = 'ci.example.com';
            RAISE EXCEPTION 'commission_rate bound NOT enforced';
          EXCEPTION WHEN check_violation THEN
            RAISE NOTICE 'commission_rate bound enforced (ok)';
          END $$;
          -- Credit ledger (migration 0008): generated commission_credit must
          -- mirror the fee math at the parent order's snapshotted rate.
          INSERT INTO order_adjustments
            (merchant_id, reconciled_order_id, source_event_id, adjustment_kind,
             adjusted_gmv, commission_rate)
            SELECT r.merchant_id, r.id, 'refund:ci-1', 'REFUND', 200.00, r.commission_rate
              FROM reconciled_agent_orders r WHERE r.shopify_order_id = 'ci-order-1';
          DO $$
          DECLARE credit numeric;
          BEGIN
            SELECT commission_credit INTO credit FROM order_adjustments
             WHERE source_event_id = 'refund:ci-1';
            -- 200.00 * 0.005 = 1.00
            IF credit IS DISTINCT FROM 1.00 THEN
              RAISE EXCEPTION 'commission_credit % != expected 1.00', credit;
            END IF;
            RAISE NOTICE 'generated commission_credit = % (ok)', credit;
          END $$;
          -- Redelivery idempotency: same source_event_id must be rejected.
          DO $$
          BEGIN
            INSERT INTO order_adjustments
              (merchant_id, reconciled_order_id, source_event_id, adjustment_kind,
               adjusted_gmv, commission_rate)
              SELECT r.merchant_id, r.id, 'refund:ci-1', 'REFUND', 1.00, r.commission_rate
                FROM reconciled_agent_orders r WHERE r.shopify_order_id = 'ci-order-1';
            RAISE EXCEPTION 'source_event_id uniqueness NOT enforced';
          EXCEPTION WHEN unique_violation THEN
            RAISE NOTICE 'source_event_id uniqueness enforced (ok)';
          END $$;
          -- Telemetry idempotency (migration 0009): duplicate event_id no-ops.
          INSERT INTO agent_intent_logs
            (merchant_id, transaction_token, protocol_type, request_method,
             endpoint_path, target_sku, event_id)
            SELECT id, 'tok_ci', 'ACP', 'GET', '/availability', 'SKU-1',
                   'ffffffff-1111-2222-3333-444444444444'
              FROM merchant_profiles WHERE shopify_shop_domain = 'ci.example.com';
          INSERT INTO agent_intent_logs
            (merchant_id, transaction_token, protocol_type, request_method,
             endpoint_path, target_sku, event_id)
            SELECT id, 'tok_ci', 'ACP', 'GET', '/availability', 'SKU-1',
                   'ffffffff-1111-2222-3333-444444444444'
              FROM merchant_profiles WHERE shopify_shop_domain = 'ci.example.com'
          ON CONFLICT (event_id) WHERE event_id IS NOT NULL DO NOTHING;
          DO $$
          DECLARE n bigint;
          BEGIN
            SELECT count(*) INTO n FROM agent_intent_logs
             WHERE event_id = 'ffffffff-1111-2222-3333-444444444444';
            IF n IS DISTINCT FROM 1 THEN
              RAISE EXCEPTION 'event_id dedup failed: % rows', n;
            END IF;
            RAISE NOTICE 'event_id dedup enforced (ok)';
          END $$;
          -- Merchant API keys (migration 0014): digest shape CHECK and
          -- hash uniqueness are the auth layer's DB-side invariants.
          INSERT INTO merchant_api_keys (merchant_id, key_hash, key_prefix, label)
            SELECT id, repeat('ab', 32), 'aop_live_ci01', 'ci key'
              FROM merchant_profiles WHERE shopify_shop_domain = 'ci.example.com';
          DO $$
          BEGIN
            INSERT INTO merchant_api_keys (merchant_id, key_hash, key_prefix)
              SELECT id, upper(repeat('cd', 32)), 'aop_live_ci02'
                FROM merchant_profiles WHERE shopify_shop_domain = 'ci.example.com';
            RAISE EXCEPTION 'key_hash shape CHECK NOT enforced (uppercase accepted)';
          EXCEPTION WHEN check_violation THEN
            RAISE NOTICE 'key_hash shape CHECK enforced (ok)';
          END $$;
          DO $$
          BEGIN
            INSERT INTO merchant_api_keys (merchant_id, key_hash, key_prefix)
              SELECT id, repeat('ab', 32), 'aop_live_ci03'
                FROM merchant_profiles WHERE shopify_shop_domain = 'ci.example.com';
            RAISE EXCEPTION 'key_hash uniqueness NOT enforced';
          EXCEPTION WHEN unique_violation THEN
            RAISE NOTICE 'key_hash uniqueness enforced (ok)';
          END $$;
          -- Revocation is a tombstone: the row survives, revoked_at set.
          UPDATE merchant_api_keys SET revoked_at = now() WHERE key_prefix = 'aop_live_ci01';
          DO $$
          DECLARE n bigint;
          BEGIN
            SELECT count(*) INTO n FROM merchant_api_keys
             WHERE key_prefix = 'aop_live_ci01' AND revoked_at IS NOT NULL;
            IF n IS DISTINCT FROM 1 THEN
              RAISE EXCEPTION 'revocation tombstone missing: % rows', n;
            END IF;
            RAISE NOTICE 'revocation tombstone present (ok)';
          END $$;
          -- Enrichment (migration 0015): the gate can never be on without a
          -- payload — the DB CHECK is the last line of that invariant.
          DO $$
          BEGIN
            UPDATE merchant_profiles SET enrichment_enabled = true, enrichment_jsonld = NULL
             WHERE shopify_shop_domain = 'ci.example.com';
            RAISE EXCEPTION 'enrichment payload CHECK NOT enforced (enabled without jsonld accepted)';
          EXCEPTION WHEN check_violation THEN
            RAISE NOTICE 'enrichment payload CHECK enforced (ok)';
          END $$;
          UPDATE merchant_profiles
             SET enrichment_jsonld = '{"@context":"https://schema.org","@type":"Organization","name":"ci"}'::jsonb,
                 enrichment_enabled = true
           WHERE shopify_shop_domain = 'ci.example.com';
          DO $$
          DECLARE n bigint;
          BEGIN
            SELECT count(*) INTO n FROM merchant_profiles
             WHERE shopify_shop_domain = 'ci.example.com'
               AND enrichment_enabled AND enrichment_jsonld ? '@context';
            IF n IS DISTINCT FROM 1 THEN
              RAISE EXCEPTION 'enrichment payload round-trip failed: % rows', n;
            END IF;
            RAISE NOTICE 'enrichment payload stored + gated (ok)';
          END $$;
          SQL
